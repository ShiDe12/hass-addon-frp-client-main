name: "FRP Client"
description: "You can use this tool to achieve remote access to local Home Assistant OS by port forwarding"
version: "1.1.0"
slug: "frp_client"
host_network: true
startup: application
boot: "auto"
init: false
map:
  - "share:rw"
privileged:
  - NET_ADMIN
devices:
  - /dev/net/tun
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
options:
  frpVersion: "0.71.1"
  githubMirror: ""
  overrideConfig: true
  serverAddr: "example.com"
  serverPort: 7000
  authToken: "123456789"
  proxyName: "homeassistant"
  proxyType: "http"
  localIP: "0.0.0.0"
  localPort: 8123
schema:
  frpVersion: str
  githubMirror: str?
  overrideConfig: bool
  serverAddr: str
  serverPort: int
  authToken: str?
  webServerPort: int?
  webServerUser: str?
  webServerPassword: str?
  customDomain: str?
  subdomain: str?
  proxyName: str
  proxyType: list(http|https|tcp|udp)?
  localIP: str?
  localPort: int?
